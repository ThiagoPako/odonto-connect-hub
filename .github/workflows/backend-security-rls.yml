name: Backend Security & Multi-tenant

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  security-and-tenant-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: odonto_db
          POSTGRES_USER: odonto_user
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        id: setup-node
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vps-api-server/package-lock.json

      - name: Verify npm cache
        run: |
          echo "Cache hit status: ${{ steps.setup-node.outputs.cache-hit }}"
          if [ "${{ steps.setup-node.outputs.cache-hit }}" = "true" ]; then
            echo "✅ npm cache restored successfully!"
          else
            echo "⚠️ npm cache not found (new cache will be created), dependencies will be installed from scratch."
          fi

      - name: Install dependencies
        run: |
          cd vps-api-server
          npm ci

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for postgres..."
            sleep 2
          done
        timeout-minutes: 2

      - name: Run RLS Security Verification
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 3
          command: |
            cd vps-api-server
            node verify-rls-security.mjs
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_DATABASE: odonto_db
          PG_USER: odonto_user
          PG_PASSWORD: postgres_password

      - name: Run Multi-tenant E2E Tests
        id: tenant-tests
        run: |
          cd vps-api-server
          npm test tests/multi-tenant-e2e.test.js -- --verbose
        env:
          JWT_SECRET: test-secret-for-ci-multi-tenant
          PG_HOST: localhost
          PG_PORT: 5432
          PG_DATABASE: odonto_db
          PG_USER: odonto_user
          PG_PASSWORD: postgres_password

      - name: Generate Multi-tenant Report
        if: always()
        run: |
          echo "### 🏥 SaaS Multi-tenant Test Report" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.tenant-tests.outcome }}" == "success" ]; then
            echo "✅ **Status:** All tenants isolated correctly." >> $GITHUB_STEP_SUMMARY
            echo "1. **Tenant A (Clinic A):** Success (Data isolated)" >> $GITHUB_STEP_SUMMARY
            echo "2. **Tenant B (Clinic B):** Success (Data isolated)" >> $GITHUB_STEP_SUMMARY
            echo "3. **Cross-tenant Protection:** Active" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Failed isolation or access error." >> $GITHUB_STEP_SUMMARY
            echo "Please check the 'Run Multi-tenant E2E Tests' step logs for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Log cache save confirmation
        if: always()
        run: |
          echo "Finalizing workflow. The actions/setup-node post-job step will automatically handle saving the cache if needed."

