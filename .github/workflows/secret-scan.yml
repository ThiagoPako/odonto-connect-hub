name: Varredura de segredos

# Procura chaves, tokens e senhas nos commits novos (do PR ou do push).
# Não varre o histórico antigo: segredos que já foram publicados precisam ser
# trocados no serviço de origem, apagar do histórico não resolve.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
