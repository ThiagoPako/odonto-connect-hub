name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -e
            echo "=== Starting deploy $(date) ==="

            cd /root/odonto-connect

            # ─── Capture current commit for rollback ───────────────────────
            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            echo "Previous commit (rollback target): $PREVIOUS_COMMIT"
            echo "$PREVIOUS_COMMIT" > /root/odonto-connect/.last-good-commit.tmp

            # ─── Chave de cifra das credenciais dos canais de WhatsApp ─────
            # ANTES do git reset: se estiver errada, o deploy para sem ter mexido em nada (o
            # rollback só existe depois do reset). AES-256-GCM, 32 bytes: hex de 64 caracteres ou
            # base64 canônico (44 com "="), as duas formas que whatsapp/crypto.mjs (parseCredentialKey)
            # aceita. Gerada UMA vez e nunca regenerada: trocar o valor torna ilegível o que já foi
            # cifrado (a rotação é por key_version). O valor nunca é impresso.
            ENV_FILE=/root/odonto-connect/vps-api-server/.env
            touch "$ENV_FILE"
            sed -i '/^WA_CREDENTIALS_KEY=$/d' "$ENV_FILE"   # linha vazia (copiada do .env.example) não conta
            WA_KEY_LINE=$(grep -m1 '^WA_CREDENTIALS_KEY=' "$ENV_FILE" || true)
            if [ -z "$WA_KEY_LINE" ]; then
              printf '\nWA_CREDENTIALS_KEY=%s\n' "$(openssl rand -hex 32)" >> "$ENV_FILE"
              echo "WA_CREDENTIALS_KEY gerado na VPS"
            else
              WA_KEY_VAL=${WA_KEY_LINE#WA_CREDENTIALS_KEY=}
              WA_KEY_OK=0
              if printf '%s' "$WA_KEY_VAL" | grep -qE '^[0-9a-fA-F]{64}$'; then
                WA_KEY_OK=1
              elif printf '%s' "$WA_KEY_VAL" | grep -qE '^[A-Za-z0-9+/]{43}=$' \
                && [ "$(printf '%s' "$WA_KEY_VAL" | base64 -d 2>/dev/null | wc -c | tr -d ' ')" = "32" ] \
                && [ "$(printf '%s' "$WA_KEY_VAL" | base64 -d 2>/dev/null | base64 | tr -d '\n')" = "$WA_KEY_VAL" ]; then
                WA_KEY_OK=1
              fi
              unset WA_KEY_VAL WA_KEY_LINE
              if [ "$WA_KEY_OK" != "1" ]; then
                echo "::error::WA_CREDENTIALS_KEY existe mas não é hex de 64 nem base64 canônico de 32 bytes; corrija à mão (não vou sobrescrever). Nada foi alterado na VPS."
                false
              fi
              echo "WA_CREDENTIALS_KEY já existe (mantido)"
            fi

            git fetch origin main
            NEW_COMMIT=$(git rev-parse origin/main)
            echo "New commit: $NEW_COMMIT"
            git reset --hard origin/main

            # ─── Rollback function ─────────────────────────────────────────
            rollback() {
              echo ""
              echo "!!! DEPLOY FAILED — INITIATING AUTOMATIC ROLLBACK !!!"
              echo "Reverting from $NEW_COMMIT to $PREVIOUS_COMMIT"
              cd /root/odonto-connect
              git reset --hard "$PREVIOUS_COMMIT" || {
                echo "FATAL: git reset failed during rollback"
                exit 2
              }

              echo "Reinstalling dependencies for rollback commit..."
              if command -v bun &> /dev/null; then
                bun install --frozen-lockfile 2>/dev/null || bun install || npm install
              else
                npm ci 2>/dev/null || npm install
              fi

              echo "Restoring backend dependencies for rollback commit..."
              if [ -d vps-api-server/node_modules.prev ]; then
                rm -rf vps-api-server/node_modules && mv vps-api-server/node_modules.prev vps-api-server/node_modules \
                  && echo "Backend node_modules restaurado da cópia anterior"
              else
                (cd vps-api-server && { npm ci --omit=dev || npm install --omit=dev; }) || echo "WARNING: backend deps reinstall failed on rollback"
              fi

              echo "Rebuilding frontend for rollback commit..."
              npm run build || echo "WARNING: rollback build failed — keeping previous dist if present"

              echo "Restarting services with rollback code..."
              pm2 delete odonto-connect odonto-api 2>/dev/null || true
              pm2 start /root/odonto-connect/ecosystem.config.cjs --update-env
              sleep 3

              # Verify rollback brought API back
              for i in $(seq 1 15); do
                RB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3002/api/health 2>/dev/null || echo "000")
                if [ "$RB_STATUS" = "200" ]; then
                  echo "Rollback API healthy (HTTP $RB_STATUS) after ${i}x2s"
                  pm2 save
                  echo "=== ROLLBACK COMPLETE — system restored to $PREVIOUS_COMMIT ==="
                  exit 1
                fi
                echo "  rollback attempt $i: HTTP $RB_STATUS — retrying in 2s..."
                sleep 2
              done

              echo "FATAL: rollback also failed — manual intervention required"
              pm2 logs odonto-api --lines 30 --nostream 2>/dev/null || true
              exit 2
            }

            # Trap any error from this point on → rollback
            trap rollback ERR

            # ─── Install deps ──────────────────────────────────────────────
            if command -v bun &> /dev/null; then
              bun install --frozen-lockfile 2>/dev/null || bun install
            else
              npm ci 2>/dev/null || npm install
            fi

            # ─── Dependências do backend (vps-api-server tem package.json próprio) ──
            # Cópia do node_modules atual: se o npm ci falhar (rede, binário nativo), o rollback
            # restaura esta cópia em vez de depender de uma nova instalação.
            rm -rf vps-api-server/node_modules.prev
            if [ -d vps-api-server/node_modules ]; then cp -a vps-api-server/node_modules vps-api-server/node_modules.prev; fi
            (cd vps-api-server && npm ci --omit=dev)

            # ─── Build frontend ────────────────────────────────────────────
            npm run build

            # ─── Variáveis do backend (automático, sem copiar/colar) ──────
            # Gera o segredo do webhook do WhatsApp uma única vez, direto na
            # VPS (nunca passa pelo GitHub nem aparece no log), e fixa o fuso.
            ENV_FILE=/root/odonto-connect/vps-api-server/.env
            touch "$ENV_FILE"
            if ! grep -qE '^EVOLUTION_WEBHOOK_SECRET=[A-Za-z0-9]{32,}' "$ENV_FILE"; then
              sed -i '/^EVOLUTION_WEBHOOK_SECRET=/d' "$ENV_FILE"
              printf '\nEVOLUTION_WEBHOOK_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$ENV_FILE"
              echo "EVOLUTION_WEBHOOK_SECRET gerado na VPS"
            else
              echo "EVOLUTION_WEBHOOK_SECRET já existe (mantido)"
            fi
            if grep -q '^TZ=' "$ENV_FILE"; then
              sed -i 's|^TZ=.*|TZ=America/Sao_Paulo|' "$ENV_FILE"
            else
              printf 'TZ=America/Sao_Paulo\n' >> "$ENV_FILE"
            fi
            chmod 600 "$ENV_FILE"

            # ─── Run pending migrations BEFORE restarting services ────────
            cat /root/odonto-connect/vps-api-server/migration.sql | sudo -u postgres psql -p 5433 -d odonto_db 2>&1 || true
            cat /root/odonto-connect/vps-api-server/migration-chat-messages.sql | sudo -u postgres psql -p 5433 -d odonto_db 2>&1 || true
            cat /root/odonto-connect/vps-api-server/migration-push-subscriptions.sql | sudo -u postgres psql -p 5433 -d odonto_db 2>&1 || true
            cat /root/odonto-connect/vps-api-server/migration-crm-kanban.sql | sudo -u postgres psql -p 5433 -d odonto_db 2>&1 || true
            cat /root/odonto-connect/vps-api-server/migration-priority-recovery.sql | sudo -u postgres psql -p 5433 -d odonto_db 2>&1 || true
            cat /root/odonto-connect/vps-api-server/migration-user-preferences.sql | sudo -u postgres psql -p 5433 -d odonto_db 2>&1 || true
            cat /root/odonto-connect/vps-api-server/migration-ai-settings.sql | sudo -u postgres psql -p 5433 -d odonto_db 2>&1 || true
            cat /root/odonto-connect/vps-api-server/migration-reativacao.sql | sudo -u postgres psql -p 5433 -d odonto_db 2>&1 || true
            cat /root/odonto-connect/vps-api-server/migration-clinicorp.sql | sudo -u postgres psql -p 5433 -d odonto_db 2>&1 || true
            cat /root/odonto-connect/vps-api-server/migration-clinicorp-user.sql | sudo -u postgres psql -p 5433 -d odonto_db 2>&1 || true
            cat /root/odonto-connect/vps-api-server/migration-saas.sql | sudo -u postgres psql -p 5433 -d odonto_db 2>&1 || true
            cat /root/odonto-connect/vps-api-server/migration-tenant-defaults.sql | sudo -u postgres psql -p 5433 -d odonto_db 2>&1 || true
            cat /root/odonto-connect/vps-api-server/migration-whatsapp-fase1.sql | sudo -u postgres psql -p 5433 -d odonto_db 2>&1 || true
            cat /root/odonto-connect/vps-api-server/migration-seguranca-p0.sql | sudo -u postgres psql -p 5433 -d odonto_db 2>&1 || true
            cat /root/odonto-connect/vps-api-server/migration-contatos-recuperacao.sql | sudo -u postgres psql -p 5433 -d odonto_db 2>&1 || true
            # Colunas usadas por agendamentos (idempotente; ausentes em produção)
            sudo -u postgres psql -p 5433 -d odonto_db -c "SET lock_timeout = '5s'; ALTER TABLE IF EXISTS agendamentos ADD COLUMN IF NOT EXISTS paciente_nome TEXT, ADD COLUMN IF NOT EXISTS dentista_nome TEXT;" 2>&1 || true
            # Colunas/tabelas que o código usa e faltam no banco (docs/banco/drift-schema-2026-11-05.md).
            # Transação única com lock_timeout: tenta até 3 vezes antes de avisar.
            ALINHAMENTO_OK=0
            for TENTATIVA in 1 2 3; do
              if cat /root/odonto-connect/vps-api-server/migration-schema-alinhamento.sql | sudo -u postgres psql -p 5433 -d odonto_db 2>&1; then
                ALINHAMENTO_OK=1; break
              fi
              echo "Alinhamento de schema: tentativa $TENTATIVA falhou; aguardando 10s..."
              sleep 10
            done
            if [ "$ALINHAMENTO_OK" != "1" ]; then
              echo "::warning title=Alinhamento de schema não aplicado::migration-schema-alinhamento.sql falhou 3x (lock ou erro). O deploy segue; ver log acima."
              echo "!!! ATENÇÃO: migration-schema-alinhamento.sql NÃO foi aplicada — cadastro de clínica, exames, lembrete 24h e PUT da agenda continuam quebrados."
            fi
            # Chaves únicas POR CLÍNICA (CPF do paciente, CRO do dentista, nome do marcador da agenda).
            # Antes eram globais: revelavam cadastro de outra clínica e bloqueavam a mesma pessoa em duas.
            # Sem BEGIN: CREATE UNIQUE INDEX CONCURRENTLY não trava a escrita.
            if ! cat /root/odonto-connect/vps-api-server/migration-unicos-por-clinica.sql | sudo -u postgres psql -p 5433 -d odonto_db 2>&1; then
              echo "::warning title=Únicos por clínica não aplicados::migration-unicos-por-clinica.sql falhou (repetido na mesma clínica, lock ou erro). As chaves globais que não foram trocadas continuam; o deploy segue. Ver log acima."
              echo "!!! ATENÇÃO: alguma chave única GLOBAL (cpf/cro/marcador) continua ativa: revisar o log acima."
            fi
            # Lista de espera (depois do alinhamento: altera agendamentos)
            # lock_timeout via PGOPTIONS (não no .sql: o boot roda o arquivo no pool)
            cat /root/odonto-connect/vps-api-server/migration-lista-espera.sql | sudo -u postgres env PGOPTIONS='-c lock_timeout=5s' psql -p 5433 -d odonto_db -v ON_ERROR_STOP=1 2>&1 \
              || echo "::warning::migration-lista-espera.sql falhou: confira as tabelas lista_espera/lista_espera_ofertas e as colunas liberado_por/liberado_em de agendamentos"
            # Saúde dos números de WhatsApp (mesmo lock_timeout via PGOPTIONS)
            cat /root/odonto-connect/vps-api-server/migration-whatsapp-saude.sql | sudo -u postgres env PGOPTIONS='-c lock_timeout=5s' psql -p 5433 -d odonto_db -v ON_ERROR_STOP=1 2>&1 \
              || echo "::warning::migration-whatsapp-saude.sql falhou: confira whatsapp_instance_health_log e as colunas connection_state/state_since de whatsapp_instances"
            # Canais de WhatsApp por clínica (camada de provedor, F0): depois da saúde (copia o estado)
            cat /root/odonto-connect/vps-api-server/migration-whatsapp-canais.sql | sudo -u postgres env PGOPTIONS='-c lock_timeout=5s' psql -p 5433 -d odonto_db -v ON_ERROR_STOP=1 2>&1 \
              || echo "::warning::migration-whatsapp-canais.sql falhou: confira whatsapp_channels, whatsapp_webhook_events e as colunas channel_id de automation_jobs/chat_messages"
            # Integridade do prontuário (cria prontuario_versoes: antes do dono-tabelas-deploy)
            cat /root/odonto-connect/vps-api-server/migration-prontuario-integridade.sql | sudo -u postgres psql -p 5433 -d odonto_db -v ON_ERROR_STOP=1 2>&1 \
              || echo "::warning::migration-prontuario-integridade.sql falhou: confira as colunas de autoria/inativação de prontuarios e a tabela prontuario_versoes"
            # Dono das tabelas criadas acima pelo deploy (postgres) → dono das tabelas da API; senão a
            # RLS vale para o odonto_app e jobs sem contexto de clínica são bloqueados em silêncio.
            # Só de deploy (bloco DO; o boot não roda). Fica DEPOIS de lista de espera e saúde do WhatsApp.
            cat /root/odonto-connect/vps-api-server/migration-dono-tabelas-deploy.sql | sudo -u postgres env PGOPTIONS='-c lock_timeout=5s' psql -p 5433 -d odonto_db -v ON_ERROR_STOP=1 2>&1 \
              || echo "::warning::migration-dono-tabelas-deploy.sql falhou: confira o dono (pg_tables.tableowner) de lista_espera, lista_espera_ofertas, whatsapp_instance_health_log, whatsapp_opt_outs, whatsapp_channels, whatsapp_webhook_events e prontuario_versoes"
            # B2/B3: orçamentos (titulo/print_config/odontograma_snapshot), catálogo de procedimentos
            # + versões, tenant_id da reativação. Só de deploy (blocos DO). Depois da schema-alinhamento.
            cat /root/odonto-connect/vps-api-server/migration-schema-b2-b3.sql | sudo -u postgres env PGOPTIONS='-c lock_timeout=5s' psql -p 5433 -d odonto_db -v ON_ERROR_STOP=1 2>&1 \
              || echo "::warning::migration-schema-b2-b3.sql falhou: orçamentos (titulo/print_config/odontograma_snapshot), procedimentos_catalogo_versoes e tenant_id da reativação continuam faltando"
            # Índices de desempenho — por último: não cria tabela e um lock_timeout aqui não atrasa o schema (CREATE INDEX CONCURRENTLY, sem travar escrita; só cria).
            if ! cat /root/odonto-connect/vps-api-server/migration-indices-desempenho.sql | sudo -u postgres psql -p 5433 -d odonto_db 2>&1; then
              echo "::warning title=Índices de desempenho não aplicados::migration-indices-desempenho.sql falhou (lock ou erro). Só desempenho: o deploy segue e o próximo tenta de novo. Ver log acima."
              echo "!!! ATENÇÃO: migration-indices-desempenho.sql NÃO foi aplicada por completo."
            fi
            echo "=== Migrations applied ==="

            # ─── Pre-flight syntax check on server.mjs ─────────────────────
            echo "Validating server.mjs syntax..."
            node --check /root/odonto-connect/vps-api-server/server.mjs || {
              echo "ERROR: server.mjs has a syntax error — aborting before restart"
              false
            }

            # ─── Restart services ──────────────────────────────────────────
            pm2 delete odonto-connect odonto-api 2>/dev/null || true
            pm2 start /root/odonto-connect/ecosystem.config.cjs --update-env

            # ─── Wait for API to be ready (up to 30s) ──────────────────────
            echo "Waiting for API healthcheck (/api/health)..."
            API_READY=0
            for i in $(seq 1 15); do
              API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3002/api/health 2>/dev/null || echo "000")
              if [ "$API_STATUS" = "200" ]; then
                echo "API healthy (HTTP $API_STATUS) after ${i}x2s"
                API_READY=1
                break
              fi
              echo "  attempt $i: HTTP $API_STATUS — retrying in 2s..."
              sleep 2
            done

            # Pretty-print structured health payload for diagnostics
            HEALTH_PAYLOAD=$(curl -s http://127.0.0.1:3002/api/health 2>/dev/null || echo '{}')
            echo "=== /api/health payload ==="
            echo "$HEALTH_PAYLOAD" | node -e "
              let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
                try{
                  const h=JSON.parse(d);
                  console.log('Status   :', h.status);
                  console.log('Code     :', h.code);
                  console.log('Message  :', h.message);
                  console.log('Uptime   :', h.uptime_s+'s');
                  console.log('Latency  :', h.response_time_ms+'ms');
                  if(h.checks) for(const [k,v] of Object.entries(h.checks)){
                    console.log('  ['+k+']', JSON.stringify(v));
                  }
                  if(h.errors && h.errors.length){
                    console.log('--- Errors ---');
                    for(const e of h.errors){
                      console.log('  ['+e.severity.toUpperCase()+'] '+e.code+' ('+e.dependency+')');
                      console.log('    → '+e.message);
                      if(e.detail) console.log('    detail: '+JSON.stringify(e.detail));
                    }
                  }
                  if(h.summary){
                    console.log('Summary  :', JSON.stringify(h.summary));
                  }
                }catch(e){console.log('(unparseable response)', d.slice(0,500));}
              });" 2>/dev/null || echo "$HEALTH_PAYLOAD"
            echo "==========================="

            if [ "$API_READY" != "1" ]; then
              # Extract failure code for at-a-glance diagnosis
              FAIL_CODE=$(echo "$HEALTH_PAYLOAD" | node -e "
                let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
                  try{const h=JSON.parse(d);console.log(h.code||'UNKNOWN');}
                  catch(e){console.log('NO_RESPONSE');}
                });" 2>/dev/null || echo 'NO_RESPONSE')
              echo "ERROR: API healthcheck failed — code: $FAIL_CODE"
              pm2 logs odonto-api --lines 30 --nostream 2>/dev/null || true
              false
            fi

            # ─── Detect crash loop (PM2 restart count) ─────────────────────
            RESTARTS=$(pm2 jlist | node -e "
              let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
                try{const a=JSON.parse(d);const x=a.find(p=>p.name==='odonto-api');
                console.log(x?x.pm2_env.restart_time:0);}catch(e){console.log(0);}
              });" 2>/dev/null || echo 0)
            echo "odonto-api restart count: $RESTARTS"
            if [ "$RESTARTS" -gt 5 ]; then
              echo "ERROR: odonto-api is in a restart loop ($RESTARTS restarts)"
              pm2 logs odonto-api --lines 30 --nostream 2>/dev/null || true
              false
            fi

            # ─── Wait for frontend to be ready (up to 20s) ─────────────────
            echo "Waiting for frontend healthcheck..."
            FE_READY=0
            for i in $(seq 1 10); do
              FE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/login 2>/dev/null || echo "000")
              if [ "$FE_STATUS" = "200" ]; then
                echo "Frontend ready (HTTP $FE_STATUS) after ${i}x2s"
                FE_READY=1
                break
              fi
              echo "  attempt $i: HTTP $FE_STATUS — retrying in 2s..."
              sleep 2
            done

            if [ "$FE_READY" != "1" ]; then
              echo "ERROR: Frontend not responding"
              pm2 logs odonto-connect --lines 20 --nostream 2>/dev/null || true
              false
            fi

            # ─── Success: clear trap, persist PM2 ──────────────────────────
            trap - ERR
            pm2 save
            echo "$NEW_COMMIT" > /root/odonto-connect/.last-good-commit
            rm -f /root/odonto-connect/.last-good-commit.tmp
            rm -rf /root/odonto-connect/vps-api-server/node_modules.prev
            echo "=== Deploy complete $(date) — commit $NEW_COMMIT ==="
